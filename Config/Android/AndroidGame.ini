; Android-only packaging overrides.
;
; MetaHuman content is excluded from the Android cook. The MetaHuman plugin
; declares SupportedTargetPlatforms Win64/Linux/Mac only, so the Jared avatar
; cannot render on Quest regardless - but its content still pulled the
; MetaHuman unified skin shader (M_skin_unified_UI, MI_Skin_Head_UI_LOD0) into
; the Android cook, where compiling it for OPENGL_ES3_1_ANDROID ran past 100
; minutes without finishing. That is a large amount of work for shaders that
; can never be used on this platform.
;
; Quest clients therefore fall back to the native Mimic body. That is the
; designed behaviour: WMCYNFirstSignalPresenceComponent loads every asset in a
; family before swapping any visual, so an unavailable family aborts the swap
; cleanly rather than producing a partly-dressed avatar.
;
; PCVR and editor builds are unaffected - this file is Android-only.

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToNeverCook=(Path="/Game/MetaHumans")
+DirectoriesToNeverCook=(Path="/Game/WMCYN/AvatarPipeline")
+DirectoriesToNeverCook=(Path="/MetaHumanCharacter")
+DirectoriesToNeverCook=(Path="/Game/Characters/jARED")
